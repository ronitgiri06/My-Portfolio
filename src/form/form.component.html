<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <style>
    body {
      background: #060912;
      color: #f3f1fb;
      font-family: 'Satoshi', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .form-container {
      max-width: 500px;
      width: 100%;
      padding: 40px;
      background: rgba(255,255,255,.05);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.09);
      backdrop-filter: blur(12px);
    }
    h2 {
      font-family: 'Clash Display', sans-serif;
      color: #18e0c4;
      font-size: 2rem;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      color: #9aa6b2;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }
    input, textarea {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(255,255,255,.04);
      color: #f3f1fb;
      font-size: 1rem;
      transition: all .3s;
      outline: none;
      box-sizing: border-box;
    }
    input:focus, textarea:focus {
      border-color: #18e0c4;
      box-shadow: 0 0 0 3px rgba(24,224,196,.1);
    }
    textarea {
      resize: vertical;
      min-height: 120px;
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 100px;
      border: none;
      background: linear-gradient(120deg, #46f5d6 0%, #18e0c4 55%, #00bfa6 100%);
      color: #0a0714;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all .3s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(24,224,196,.35);
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #9aa6b2;
      text-decoration: none;
      transition: color .3s;
    }
    .back-link:hover {
      color: #18e0c4;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>📬 Contact Me</h2>
    <form name="contact" netlify action="/success.html">
      <input type="hidden" name="form-name" value="contact">
      
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required placeholder="John Doe">
      </div>
      
      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" required placeholder="john@example.com">
      </div>
      
      <div class="form-group">
        <label for="message">Your Message</label>
        <textarea id="message" name="message" required placeholder="Tell me about your project..."></textarea>
      </div>
      
      <button type="submit">Send Message ✉️</button>
    </form>
    <a href="/" class="back-link">← Back to Portfolio</a>
  </div>
</body>
</html>
