<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent</title>
  <style>
    body {
      background: #060912;
      color: #f3f1fb;
      font-family: 'Satoshi', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .success-box {
      max-width: 500px;
      padding: 40px;
    }
    h1 {
      font-family: 'Clash Display', sans-serif;
      color: #18e0c4;
      font-size: 2.5rem;
      margin-bottom: 20px;
    }
    a {
      color: #18e0c4;
      text-decoration: none;
      display: inline-block;
      margin-top: 20px;
      padding: 12px 30px;
      border: 1px solid rgba(24,224,196,.3);
      border-radius: 100px;
      transition: all .3s;
    }
    a:hover {
      background: rgba(24,224,196,.1);
      transform: translateY(-2px);
    }
    .emoji {
      font-size: 4rem;
    }
  </style>
</head>
<body>
  <div class="success-box">
    <div class="emoji">✅</div>
    <h1>Message Sent!</h1>
    <p style="color: #9aa6b2; font-size: 1.1rem; line-height: 1.8;">
      Thank you for reaching out. I'll get back to you soon!
    </p>
    <a href="/">← Back to Portfolio</a>
  </div>
</body>
</html>
